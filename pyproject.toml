[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-document-qa"
version = "0.1.0"
description = "可追溯的多模态文档检索与问答系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20", "httpx>=0.28,<1", "PyMuPDF>=1.26,<2",
  "Pillow>=11", "numpy>=2,<3", "rank-bm25==0.2.2", "jieba==0.42.1",
  "sentence-transformers>=5,<6", "faiss-cpu>=1.10,<2", "streamlit>=1.45,<2",
  "python-dotenv>=1,<2", "rapidocr>=3,<4", "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
layout = ["docling>=2,<3"]
vision = ["cn-clip>=1.5,<2"]
report = ["matplotlib>=3.9,<4"]
test = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["docqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "models", "output"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
