name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCQA_API_KEY: ""
      DOCQA_PARSER: pymupdf
      DOCQA_ENABLE_CLIP: "false"
      DOCQA_LOCAL_MODELS_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install 'setuptools<81' -e '.[test]'
      - run: python -m ruff check .
      - run: python -m pytest -q
